[project]
name = "academic-research-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-openai",
    "pydantic-settings",
    "python-dotenv",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "pypdf>=5,<7",
    "mcp>=1.12,<2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "celery[redis]>=5.4,<6",
    "redis>=5,<7",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
# Cross-Encoder models pull in PyTorch, so the local zero-setup profile keeps
# them optional. The production image installs this extra.
rerank = ["sentence-transformers>=3,<6", "torch>=2.2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.10", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: end-to-end agent quality evals (slow, costs LLM calls)"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache"]
